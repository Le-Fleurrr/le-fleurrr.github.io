  <body>
    <div id="root"></div>
    <script>
      // Restore the real path after the GitHub Pages 404 redirect
      // (spa-github-pages), and translate legacy hash-router URLs
      // (/#/album/5) into real paths so old links keep working.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
        if (l.hash.indexOf('#/') === 0) {
          window.history.replaceState(null, null, l.hash.slice(1) + l.search);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
