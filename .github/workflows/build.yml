name: Build

on:
  push:
    branches: ["source-latest", "main"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Publishes the built site to the gh-pages branch on every push to
      # source-latest — replaces the local `npm run deploy` flow, which
      # hits Windows command-length limits (spawn ENAMETOOLONG).
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/source-latest' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
